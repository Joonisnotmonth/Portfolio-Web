<header
  class="fixed top-0 left-0 w-full z-50 bg-core-alpha backdrop-blur-md border-b border-white/10"
>
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="#/" class="leading-none">
      <span class="text-lg font-bold text-neutral-50 tracking-tight">Yada</span>
      <span>&nbsp;</span>
      <span class="text-lg font-light text-neutral-300">Kruekkhoksung</span>
      <span class="text-indigo-300 font-bold">.</span>
    </a>

    <div>
      <!-- Desktop & IPad -->
      <div class="hidden md:flex items-center gap-4">
        <div
          class="flex items-center rounded-full border border-white/15 p-0.5 text-xs font-semibold"
        >
          <button
            (click)="setLang('th')"
            id="btn-th"
            class="px-3 py-1 rounded-full transition"
            [ngClass]="lang.currentLang() === 'th' ? 'bg-white/20' : ''"
          >
            TH
          </button>

          <button
            (click)="setLang('en')"
            id="btn-en"
            class="px-3 py-1 text-white rounded-full transition"
            [ngClass]="lang.currentLang() === 'en' ? 'bg-white/20' : ''"
          >
            EN
          </button>
        </div>

        <a
          href="/resume.pdf"
          download
          class="text-sm px-4 py-2 rounded-full bg-indigo-300 text-zinc-800 font-semibold hover:bg-indigo-200 transition"
          ><i class="fa-solid fa-download"></i> Resume</a
        >
      </div>

      <!-- Mobile -->
      <div class="md:hidden">
        <button
          type="button"
          (click)="toggleMenu()"
          id="btn-menu"
          class="h-10 w-10 rounded-full flex items-center justify-center transition"
          [ngClass]="menuOpen() ? 'bg-indigo-300 text-zinc-800' : 'text-white hover:bg-white/10'"
          aria-label="Menu"
          aria-haspopup="menu"
          aria-controls="mobile-menu"
          [attr.aria-expanded]="menuOpen()"
        >
          <i class="fa-solid fa-ellipsis"></i>
        </button>

        @if (menuOpen()) {
          <div
            id="mobile-menu"
            role="menu"
            class="absolute right-4 top-full mt-2 w-56 rounded-xl border border-white/15 bg-zinc-800 p-1.5 shadow-lg"
          >
            <div class="flex items-center justify-between gap-2 px-2.5 py-2">
              <span class="flex items-center gap-2 text-sm text-neutral-300">
                <i class="fa-solid fa-language w-4 text-center"></i>
                {{ 'COMMON.Language' | translate }}
              </span>
              <div class="flex items-center rounded-full bg-zinc-900 p-0.5 text-xs font-semibold">
                <button
                  (click)="setLang('th')"
                  id="btn-th-mobile"
                  class="px-3 py-1 text-white rounded-full transition"
                  [ngClass]="lang.currentLang() === 'th' ? 'bg-indigo-300 !text-zinc-800' : ''"
                >
                  TH
                </button>
                <button
                  (click)="setLang('en')"
                  id="btn-en-mobile"
                  class="px-3 py-1 text-white rounded-full transition"
                  [ngClass]="lang.currentLang() === 'en' ? 'bg-indigo-300 !text-zinc-800' : ''"
                >
                  EN
                </button>
              </div>
            </div>

            <div class="my-1 h-px bg-white/10"></div>

            <a
              href="/resume.pdf"
              download
              role="menuitem"
              (click)="closeMenu()"
              class="flex items-center gap-2 rounded-lg px-2.5 py-2.5 text-sm text-neutral-50 hover:bg-white/10 transition"
            >
              <i class="fa-solid fa-download w-4 text-center text-indigo-300"></i>
              Resume
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</header>
