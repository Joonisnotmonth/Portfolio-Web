<footer
  class="bg-core inset-x-0 z-50 backdrop-blur bg-zinc-800 border-b border-white/10 text-neutral-50"
>
  <div class="max-w-6xl mx-auto px-4 lg:px-8">
    <div class="md:flex md:items-center md:justify-between py-8">
      <div>
        <h2 class="text-lg font-bold">{{ name }}</h2>
        <p class="text-sm text-faint">BKK ⇄ CNX</p>
      </div>
      <div class="flex gap-3 max-sm:pt-2">
        <button
          type="button"
          class="inline-flex items-center justify-center shrink-0 size-10 rounded-full bg-lime-200 hover:bg-lime-100 transition text-zinc-800"
          aria-label="Email"
        >
          <i class="fa-regular fa-envelope"></i>
        </button>
        <button
          class="inline-flex items-center justify-center shrink-0 size-10 rounded-full bg-rose-200 hover:bg-rose-100 transition text-zinc-800"
          aria-label="Git Hub"
        >
          <i class="fa-brands fa-github"></i>
        </button>
        <button
          class="inline-flex items-center justify-center shrink-0 size-10 rounded-full bg-indigo-300 hover:bg-indigo-200 transition text-zinc-800"
          aria-label="Linkedin"
        >
          <i class="fa-brands fa-linkedin-in"></i>
        </button>
      </div>
    </div>

    <hr class="border-white/10" />

    <div class="py-2 flex max-sm:flex-col-reverse items-center justify-between text-sm text-faint">
      <p>
        <i class="fa-regular fa-xs fa-copyright"></i>
        {{ year }} {{ name }}. &nbsp; | &nbsp;
        {{ 'CORE.FOOTER_RIGHTS' | translate }}
      </p>
      <p class="hover:underline cursor-pointer" (click)="scrollToTop()">
        {{ 'COMMON.PAGE_TOP' | translate }} <i class="fa-solid fa-xs fa-arrow-up-long"></i>
      </p>
    </div>
  </div>
</footer>
